<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="个人静态图片资源库">
  <title>图片资源库</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #202936; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); padding: clamp(28px, 7vw, 48px); background: #fff; border: 1px solid #e7edf5; border-radius: 20px; box-shadow: 0 18px 54px rgba(28, 48, 75, .07); }
    .mark { display: inline-grid; place-items: center; width: 54px; height: 54px; border-radius: 15px; background: #e8f1ff; font-size: 28px; }
    h1 { margin: 22px 0 12px; font-size: clamp(25px, 6vw, 32px); letter-spacing: .02em; }
    p { color: #586579; line-height: 1.8; margin: 0 0 22px; }
    .hint { padding: 16px; border-radius: 12px; background: #f5f8fc; font-size: 14px; line-height: 1.8; color: #465468; overflow-wrap: anywhere; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: #1754a5; }
    footer { margin-top: 24px; color: #8994a4; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🖼️</div>
    <h1>图片资源库</h1>
    <p>欢迎访问！这里用于托管静态图片资源。请使用图片对应的链接直接访问文件。</p>
    <div class="hint">
      图片放在仓库的 <code>images</code> 文件夹中。<br>
      图片地址格式：<code>本站地址/images/图片文件名.png</code>
    </div>
    <footer>Powered by GitHub Pages</footer>
  </main>
</body>
</html>
